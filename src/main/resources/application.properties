spring.application.name=LT_Web_spring_boot

# Dung lai DB QLJPA cua bai_tap_02 (da co san bang categories, app_user)
# Neu ban muon dung DB rieng cho bai 5, doi databaseName + user/password o day.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QLJPA;encrypt=true;trustServerCertificate=true;characterEncoding=UTF-8
spring.datasource.username=sa
spring.datasource.password=ej12345890@
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# ddl-auto=update: tu dong ALTER TABLE neu entity co them cot moi, KHONG xoa du lieu cu
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# QUAN TRONG: Spring Boot mac dinh dung SpringPhysicalNamingStrategy, tu doi
# TAT CA ten cot camelCase thanh snake_case (vd categoryId -> category_id) -
# ke ca khi da khai bao @Column(name=...) tuong minh! Vi DB dang dung (QLJPA,
# tao tu bai_tap_02 bang Hibernate thuan) co cot dat ten camelCase that su
# (categoryId, createdDate, otpCode...), phai tat naming strategy nay de
# Hibernate lay dung ten cot nhu khai bao, khong tu doi.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# View resolver cho JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

server.port=8080
